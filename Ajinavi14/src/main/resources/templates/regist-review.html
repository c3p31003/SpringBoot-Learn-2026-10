<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
	<meta charset="UTF-8">
	<title>レビュー登録</title>
	<!-- Google Fontsの読み込みタグを追加 -->
	<link href="https://fonts.googleapis.com/css?family=M+PLUS+Rounded+1c" rel="stylesheet">
	<!-- CSSファイルの読み込み -->
	<link rel="stylesheet" th:href="@{/css/style.css}">
	<link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

	<h2>レビュー登録</h2>
	
	<!--th:actionは送り先の指定。URLパターン/regist-reiviewを指定している-->
	<!--th:object属性は${Model内の属性名}でオブジェクトを指定している。-->
	<form th:action="@{/regist-review}" th:object="${reviewRegistForm}" method="POST">
		【店舗ID】<br>
		<!--th:field="*{フィールド名}"の形でそのオブジェクトのフィールドを参照している-->
		<input type="text"th:field="*{restaurantId}"><br>
		<div th:if="${#fields.hasErrors('restaurantId')}" th:errors="*{restaurantId}" class="error-msg"></div>
		<br>
		【利用者ID】<br>
		<input type="text" th:field="*{userId}"><br>
		<div th:if="${#fields.hasErrors('userId')}" th:errors="*{userId}" class="error-msg"></div>
		<br>
		【来店日】<br>
		<input type="date" th:field="*{visitDate}"><br>
		<div th:if="${#fields.hasErrors('visitDate')}" th:errors="*{visitDate}" class="error-msg"></div>
		<br>
		【評価】(1-5)<br>
		<input type="text" th:field="*{rating}"><br>
		<div th:if="${#fields.hasErrors('rating')}" th:errors="*{rating}" class="error-msg"></div>
		<br>
		【一言コメント】<br>
		<input type="text" th:field="*{comment}" class="comment"><br>
		<div th:if="${#fields.hasErrors('comment')}" th:errors="*{comment}" class="error-msg"></div>
		<br>
		<input type="submit" value="登録" class="btn">
	</form>

</body>

</html>
